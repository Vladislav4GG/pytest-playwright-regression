name: Regression

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        type: choice
        options: [S1, S2]
        default: S1

      run_all:
        description: "Run all regression functional tests"
        required: true
        type: boolean
        default: true

      case_cookie_management:
        description: "cookie_banner_page.py"
        required: false
        type: boolean
        default: false

      case_country_locale:
        description: "site_selector_page.py"
        required: false
        type: boolean
        default: false

      case_auth_navigation:
        description: "auth_page.py"
        required: false
        type: boolean
        default: false

      case_menu_links:
        description: "menu_navigation_page.py"
        required: false
        type: boolean
        default: false

      case_smartedit_homepage_amplience:
        description: "smartedit_homepage_amplience.py"
        required: false
        type: boolean
        default: false

      menu_links_limit:
        description: "Optional limit for menu links test (0 = no limit)"
        required: false
        type: string
        default: "0"

      menu_links_workers:
        description: "Parallel workers for menu links check"
        required: false
        type: string
        default: "8"

      smartedit_site_label:
        description: "SmartEdit site label"
        required: false
        type: string
        default: "Epson United Kingdom"

      smartedit_catalog_label:
        description: "SmartEdit catalog label"
        required: false
        type: string
        default: "Epson GB Content Catalog"

      smartedit_page_search_query:
        description: "SmartEdit pages search query"
        required: false
        type: string
        default: "vlad"

      smartedit_page_name:
        description: "SmartEdit target page name"
        required: false
        type: string
        default: "vladampliencepage"

      smartedit_target_slot_id:
        description: "SmartEdit target slot id"
        required: false
        type: string
        default: "Content3Slot-cmsitem_00475000"

      smartedit_amplience_slot_id:
        description: "Amplience Slot Id value"
        required: false
        type: string
        default: "b55e50d0-8195-4945-ad41-5e7e61efc647"

      smartedit_rendered_heading_text:
        description: "Expected heading rendered on storefront page"
        required: false
        type: string
        default: "Content text HUP+"

      smartedit_storefront_page_url:
        description: "Optional direct storefront URL for verification"
        required: false
        type: string
        default: ""

jobs:
  run-regression:
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ inputs.env }}
      MENU_LINKS_LIMIT: ${{ inputs.menu_links_limit }}
      MENU_LINKS_WORKERS: ${{ inputs.menu_links_workers }}

      PW_HEADLESS: "true"
      PW_TIMEOUT_MS: "60000"
      PYTHONUNBUFFERED: "1"

      STAGE_EMAIL: ${{ secrets.STAGE_EMAIL }}
      STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
      REG_EMAIL: ${{ secrets.STAGE_EMAIL }}
      REG_PASS: ${{ secrets.STAGE_PASSWORD }}

      SMARTEDIT_URL: ${{ secrets.SMARTEDIT_URL }}
      SMARTEDIT_USERNAME: ${{ secrets.SMARTEDIT_USERNAME }}
      SMARTEDIT_PASSWORD: ${{ secrets.SMARTEDIT_PASSWORD }}

      SMARTEDIT_SITE_LABEL: ${{ inputs.smartedit_site_label }}
      SMARTEDIT_CATALOG_LABEL: ${{ inputs.smartedit_catalog_label }}
      SMARTEDIT_PAGE_SEARCH_QUERY: ${{ inputs.smartedit_page_search_query }}
      SMARTEDIT_PAGE_NAME: ${{ inputs.smartedit_page_name }}
      SMARTEDIT_TARGET_SLOT_ID: ${{ inputs.smartedit_target_slot_id }}
      SMARTEDIT_AMPLIENCE_SLOT_ID: ${{ inputs.smartedit_amplience_slot_id }}
      SMARTEDIT_RENDERED_HEADING_TEXT: ${{ inputs.smartedit_rendered_heading_text }}
      SMARTEDIT_STOREFRONT_PAGE_URL: ${{ inputs.smartedit_storefront_page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve environment URLs
        shell: bash
        run: |
          set -euo pipefail

          case "${TEST_ENV}" in
            S1)
              UI_HOST="epson-gb.cbnd-seikoepso3-s1-public.model-t.cc.commerce.ondemand.com"
              SHIPMENT_HOST="api.cbnd-seikoepso3-s1-public.model-t.cc.commerce.ondemand.com"
              ;;
            S2)
              UI_HOST="epson-gb.cbnd-seikoepso3-s2-public.model-t.cc.commerce.ondemand.com"
              SHIPMENT_HOST="api.cbnd-seikoepso3-s2-public.model-t.cc.commerce.ondemand.com"
              ;;
            *)
              echo "Unknown TEST_ENV=${TEST_ENV}"
              exit 1
              ;;
          esac

          echo "UI_BASE_URL=https://${UI_HOST}" >> "$GITHUB_ENV"
          echo "SHIPMENT_API_URL=https://${SHIPMENT_HOST}" >> "$GITHUB_ENV"

      - name: Resolve selected regression cases
        id: cases
        shell: bash
        run: |
          set -euo pipefail

          declare -a TARGETS

          if [ "${{ inputs.run_all }}" = "true" ]; then
            TARGETS+=(
              "tests/functional/test_cookie_banner.py"
              "tests/functional/test_site_selector_locale.py"
              "tests/functional/test_account_access_navigation.py"
              "tests/functional/test_menu_links.py"
              "tests/functional/test_smartedit_homepage_amplience.py"
            )
          else
            [ "${{ inputs.case_cookie_management }}" = "true" ] && TARGETS+=("tests/functional/test_cookie_banner.py")
            [ "${{ inputs.case_country_locale }}" = "true" ] && TARGETS+=("tests/functional/test_site_selector_locale.py")
            [ "${{ inputs.case_auth_navigation }}" = "true" ] && TARGETS+=("tests/functional/test_account_access_navigation.py")
            [ "${{ inputs.case_menu_links }}" = "true" ] && TARGETS+=("tests/functional/test_menu_links.py")
            [ "${{ inputs.case_smartedit_homepage_amplience }}" = "true" ] && TARGETS+=("tests/functional/test_smartedit_homepage_amplience.py")
          fi

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "No regression cases selected. Enable run_all or pick at least one checkbox."
            exit 1
          fi

          {
            echo "targets<<EOF"
            printf '%s\n' "${TARGETS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Selected targets:"
          printf ' - %s\n' "${TARGETS[@]}"

      - name: Run selected regression tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARGETS <<< "${{ steps.cases.outputs.targets }}"
          pytest -vv -s "${TARGETS[@]}" --alluredir=allure-results

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            allure-results
            artifacts
